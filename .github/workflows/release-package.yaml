name: Release package
on:
  workflow_dispatch:
    inputs:
      package_name:
        description: "Name of the package to release"
        type: string
        required: true
      version:
        description: "Version of the package to release"
        type: string
        required: true
      test:
        description: |
          Only perform a conda build test of the package version, without uploading
          the conda package on Anaconda.org or adding a tag and GitHub release.
        type: boolean
        default: false
        required: false
  workflow_call:
    inputs:
      package_name:
        description: "Name of the package to release"
        type: string
        required: true
      version:
        description: "Version of the package to release"
        type: string
        required: true
env:
  RELEASE_WORKFLOW: release-package.yaml

jobs:
  inputs-sanity-check:
    name: Inputs sanity check
    runs-on: ubuntu-latest
    outputs:
      package_name: ${{ steps.check-inputs.outputs.package_name }}
      version: ${{ steps.check-inputs.outputs.version }}
      release_json: ${{ steps.check-inputs.outputs.release_json }}
    env:
      NAME: ${{ inputs.package_name }}
      VERSION: ${{ inputs.version }}
      IS_TEST: ${{ inputs.test }}
    steps:
      - name: Check inputs
        id: check-inputs
        run: |
          if [ -z "$NAME" ]; then
            echo "::error:: Empty 'package_name' found. 'package_name' needs to be non-empty."
            exit 1
          elif [ -z "$VERSION" ]; then
            echo "::error:: Empty 'version' found. 'version' needs to be non-empty."
            exit 1
          fi
          echo "package_name=$NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "::notice::Package to be released in this workflow: ${NAME}-${VERSION}"
          if [[ "$IS_TEST" == true ]]; then
            echo "::notice::Test mode enabled. The package will not be uploaded."
          fi

  set-tag-name:
    name: Set tag name and release name
    runs-on: ubuntu-latest
    needs: inputs-sanity-check
    outputs:
      tag_name: ${{ steps.set-tag.outputs.tag_name }}
      release_name: ${{ steps.set-release.outputs.release_name }}
    env:
      NAME: ${{ needs.inputs-sanity-check.outputs.package_name }}
      VERSION: ${{ needs.inputs-sanity-check.outputs.version }}
    steps:
      - name: Set tag name
        id: set-tag
        run: echo "tag_name=${NAME}-${VERSION}" >> $GITHUB_OUTPUT

      - name: Set release name
        id: set-release
        run: echo "release_name=${NAME} ${VERSION}" >> $GITHUB_OUTPUT

  release-conda-package:
    name: Release ${{ needs.set-tag-name.outputs.release_name }} conda package
    runs-on: ubuntu-latest
    needs: [inputs-sanity-check, set-tag-name]
    env:
      VERSION: ${{ needs.inputs-sanity-check.outputs.version }} # Needed as an env variable for the conda recipe
      GIT_HASH: ${{ github.sha }} # Needed as an env variable for the conda recipe
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 #v3.2.1
        with:
          environment-file: env-build.yml

      - name: Build and upload conda package
        id: conda-build
        uses: ACCESS-NRI/action-build-and-upload-conda-packages@v3.1.0
        with:
          meta_yaml_dir: packages/${{ needs.inputs-sanity-check.outputs.package_name }}/recipe
          user: ${{ secrets.ANACONDA_USERNAME }}
          token: ${{ secrets.ANACONDA_TOKEN }}
          upload: ${{ ! inputs.test }}
          conda_build_args: -c accessnri -c conda-forge -c nodefaults
    
      - name: Create tag
        id: create-tag
        if: ${{ ! inputs.test }}
        run: |
          # Create tag
          git tag '${{ needs.set-tag-name.outputs.tag_name }}' ${{ github.sha }}
          git push origin tag '${{ needs.set-tag-name.outputs.tag_name }}'

      - name: Create Release
        if: ${{ ! inputs.test }}
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 #v2.3.2
        with:
          tag_name: '${{ needs.set-tag-name.outputs.tag_name }}'
          name: '${{ needs.set-tag-name.outputs.release_name }}'
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |-
            ${{ steps.conda-build.outputs.paths }}