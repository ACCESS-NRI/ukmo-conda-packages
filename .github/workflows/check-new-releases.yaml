name: Check new releases
# Check new releases of the packages inside the `packages/` directory from MetOffic GitHub Organisation.
# If any package has a new release, it triggers the `release-package.yaml` workflow.

on:
  workflow_dispatch:
  # Run the 1st of each month at 1:10am UK summer time (12:10am UK winter time)
  schedule:
    - cron: '10 0 1 * *'
env:
  RELEASE_WORKFLOW: release-package.yaml

jobs:
  get-packages-names:
    name: Get packages name
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.get-packages.outputs.packages }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        
      - name: Get package names
        id: get-packages
        run: |
          # Get package names from directories inside 'packages/'
          packages=$(find ./packages -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | tr '\n' ' ')
          echo "packages=$packages" >> $GITHUB_OUTPUT
          echo "::notice::Found packages: $packages"

  get-packages-to-release:
    name: Get new packages to be released
    runs-on: ubuntu-latest
    needs: get-packages-names
    outputs:
      release_json: ${{ steps.check-new-releases.outputs.release_json }}
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN_METOFFICE }}
    permissions:
      actions: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-tags: true
          fetch-depth: 0
        
      - name: Check new releases
        id: check-new-releases
        run: |
          # For each package, check if a new release on the MetOffice
          # GitHub organisation is present
          release_json=[]
          for package in ${{ needs.get-packages-names.outputs.packages }}; do
            echo "Checking new release for $package ..."
            github_repo_url=$(
              cat "./packages/$package/recipe/meta.yaml" \
              | awk -F'git_url:' '/^[[:space:]]*git_url:/ {print $2}' \
              | awk '{print $1}'
            )
            # Get repository in the format 'owner/repo' from the git_url
            owner_repo="${github_repo_url#https://github.com/}"
            owner_repo="${owner_repo%.git}"
            latest_version=$(gh release view --repo $owner_repo --json tagName -q ".tagName")
            if [ -z "$latest_version" ]; then
              echo "::error::No releases found for '$package' in the GitHub repository '$owner_repo'."
              exit 1
            fi
            # If a tag in the format '<PACKAGE-NAME>-<VERSION>' is not already present,
            # add the latest version to the packages to release (release_json).
            if [ -z "$(git tag -l "${package}-${latest_version}")" ]; then
              echo "Found new '$package' version: $latest_version"
              json=$(
                jq -cn --arg pkg "$package" --arg ver "$latest_version" \
                '{package_name: $pkg, version: $ver}'
              )
              release_json=$(jq -c --argjson json_obj "$json" '. += [$json_obj]' <<< "$release_json")
              echo "Added '${package}-${latest_version}' to the packages to be released."
            else
              echo "Latest $package version on GitHub ('$latest_version') is already released."
            fi
          done
          if [[ $release_json != '[]' ]]; then
            echo "::notice::New packages to be released: $release_json"
          else
            echo "::notice::No new packages to be released."
          fi
          # Set the release_json as a GitHub output to be used in the next job
          echo "release_json=$release_json" >> $GITHUB_OUTPUT

  release-new-packages:
    name: Release new packages
    needs: get-packages-to-release
    # Only run if there are new packages to release
    if: needs.get-packages-to-release.outputs.release_json != '[]'
    strategy:
      matrix:
        package: ${{ fromJSON(needs.get-packages-to-release.outputs.release_json) }}
      fail-fast: false
    uses: $/.github/workflows/release-package.yaml
    with:
      package_name: ${{ matrix.package.package_name }}
      version: ${{ matrix.package.version }}
    permissions:
      contents: write

  keepalive:
    name: Keepalive
    needs: release-new-packages
    if: ${{ !cancelled() && !failure() }}
    permissions:
      contents: write
    uses: $/.github/workflows/keepalive.yaml