{% set name = "ants" %}

package:
  name: "{{ name|lower }}"
  version: {{ environ["VERSION"] }}

source:
  git_url: https://github.com/MetOffice/ANTS.git
  git_rev: {{ environ["VERSION"] }}

build:
  number: 0
  skip: true # [not linux64]

requirements:
  host:
    - python
    - setuptools
  run:
    - python
    - numpy<2
    - cartopy
    - dask
    - esmf=8.4.2=mpi_mpich_h2a0de38_103
    - esmpy=8.4.2
    - f90nml
    - gdal
    - mule-base
    - numba
    - pykdtree
    - python-stratify
    - scitools-iris=3.7.1
    - um-spiral-search

test:
  source_files:
    - lib/ants/tests/resources
  requires:
    - mule-utils
    - pytest
  imports:
    - ants
  commands:
    - ancil_2anc.py -h
    - ancil_create_shapefile.py -h
    - ancil_fill_n_merge.py -h
    - ancil_general_regrid.py -h
    - ants-version
    # Enable ants to find the proper test resources
    - rm -rf ${SP_DIR}/ants/tests/resources
    - ln -vs ${SRC_DIR}/lib/ants/tests/resources ${SP_DIR}/ants/tests/resources
    # Run the tests ignoring the following problematic tests:
    # - deprecation warnings log
    # - 'test_point_lie_beyond_crs_definition' function
    # - 'TestWarning::test_warning' method
    # - 'TestLicenseHeaders' class
    - |
      $PYTHON -m pytest -W default -vs ${SP_DIR}/ants/tests \
      --ignore ${SP_DIR}/ants/tests/fileformats/test_deprecation_warnings.py \
      -k 'not test_point_lie_beyond_crs_definition and not (TestWarning and test_warning) and not TestLicenseHeaders'

about:
  home: https://github.com/MetOffice/ants
  license: BSD
  license_file: LICENSE.txt
  summary: ANTS is a versatile Python library for developing ancillary applications.
  extra:
    git_hash: {{ environ["GIT_HASH"] }}