{% set name = "shumlib" %}

package:
  name: "{{ name|lower }}"
  version: {{ environ["VERSION"] }}

source:
  git_url: https://github.com/MetOffice/shumlib.git
  git_rev: {{ environ["VERSION"] }}

build:
  number: 0
  skip: true # [not linux-64]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('fortran') }}
    - binutils
    - make
    - sed

about:
  home: https://github.com/MetOffice/shumlib
  license: BSD
  license_file: LICENCE
  summary: Unified Model Shared Libraries
  extra:
    git_hash: {{ environ["GIT_HASH"] }}